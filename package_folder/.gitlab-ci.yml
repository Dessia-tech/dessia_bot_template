# GitLab CI configuration using ci-templates

include:
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/common.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/verify_changelog.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/check_pre_commit.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/install_test.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/mr_test.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/generate_dist_wheel.yml'


verify_changelog_update:
  extends: .verify_changelog


check_pre_commit:
  extends: .check_pre_commit


# MR: all unit tests with coverage + all scripts (automatic, blocking)
# INSTALL_GROUPS is restated because .mr_test clears it: the test group carries pytest.
# TEST_SCRIPT overrides .mr_test's --modified-scripts default: every script runs on every push.
mr_tests:
  extends: .mr_test
  variables:
    INSTALL_GROUPS: "test"
    TEST_SCRIPT: "test.py --unittests --coverage --scripts"


generate_dist_wheel:
  extends: .generate_dist_wheel
