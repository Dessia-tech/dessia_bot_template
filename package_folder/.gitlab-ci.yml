# GitLab CI configuration using ci-templates

include:
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/common.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/verify_changelog.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/check_pre_commit.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/install_test.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/mr_test.yml'
  - project: 'dessia/sdk/ci-templates'
    file: '/templates/generate_dist_wheel.yml'


verify_changelog_update:
  extends: .verify_changelog


check_pre_commit:
  extends: .check_pre_commit


# Tests. Runs on every push to a merge request; a failure blocks the merge.
#
# TEST_SCRIPT spells out what is run:
#   --unittests  pytest over tests/, reported in the merge request test widget (report.xml)
#   --coverage   measures coverage and fails under the thresholds set in [coverage] (pyproject.toml)
#   --scripts    runs every script in scripts/, except those listed in untracked_scripts
#
# INSTALL_GROUPS names the dependency group to install beside the package: test carries pytest.
mr_tests:
  extends: .mr_test
  variables:
    INSTALL_GROUPS: "test"
    TEST_SCRIPT: "test.py --unittests --coverage --scripts"


generate_dist_wheel:
  extends: .generate_dist_wheel
